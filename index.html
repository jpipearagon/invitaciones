<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f8f6f2;
    font-family: 'Cormorant Garamond', serif;
    text-align: center;
    color: #222;
    overflow-x: hidden;
}

.container {
    max-width: 430px;
    margin: auto;
    padding: 40px 20px;
    min-height: 100vh;
    position: relative;
}

.flower-top,
.flower-bottom {
    position: absolute;
    width: 140px;
    opacity: 0.7;
}

.flower-top {
    top: 0;
    left: 0;
}

.flower-bottom {
    bottom: 0;
    right: 0;
    transform: rotate(180deg);
}

.subtitle {
    font-size: 18px;
    letter-spacing: 3px;
    margin-top: 80px;
}

.names {
    font-family: 'Great Vibes', cursive;
    font-size: 58px;
    margin: 25px 0;
}

.date {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 50px;
}

.envelope {
    width: 250px;
    margin: auto;
    cursor: pointer;
    transition: transform 0.4s ease;
}

.envelope:hover {
    transform: scale(1.03);
}

.envelope img {
    width: 100%;
    border-radius: 12px;
}

.click-text {
    margin-top: 20px;
    font-size: 18px;
    letter-spacing: 2px;
}

.reserve {
    margin-top: 50px;
    font-size: 18px;
    letter-spacing: 2px;
}

.number-box {
    display: inline-block;
    border: 2px solid #8fa59b;
    border-radius: 18px;
    padding: 10px 30px;
    font-size: 52px;
    margin: 15px 0;
}

#video-container {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
}

#video-container iframe {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div class="container">

    <img class="flower-top" src="https://png.pngtree.com/png-vector/20240125/ourmid/pngtree-blue-watercolor-flower-png-image_11496776.png">

    <div class="subtitle">NUESTRA BODA</div>

    <div class="names">Mariana & Daniel</div>

    <div class="date">29 · AGOSTO · 2025</div>

    <div class="envelope" onclick="openInvitation()">
        <img src="https://i.imgur.com/j4KpK0D.png" alt="Sobre">
    </div>

    <div class="click-text">CLICK PARA ABRIR LA INVITACIÓN</div>

    <div class="reserve">HEMOS RESERVADO</div>

    <div class="number-box">2</div>

    <div class="reserve">LUGARES EN SU HONOR</div>

    <img class="flower-bottom" src="https://png.pngtree.com/png-vector/20240125/ourmid/pngtree-blue-watercolor-flower-png-image_11496776.png">

</div>

<div id="video-container">
    <iframe id="video"
        src=""
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

<script>
function openInvitation() {
    document.getElementById("video-container").style.display = "block";
    document.getElementById("video").src =
        "https://player.vimeo.com/video/TU_VIDEO_ID?autoplay=1";
}
</script>

</body>
</html>
