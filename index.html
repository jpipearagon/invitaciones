<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Felipe & Nataly</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#f8f6f2;
    font-family:'Cormorant Garamond', serif;
    color:#222;
}

.container{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:50px 25px;
    text-align:center;
    position:relative;
}

.floral-top,
.floral-bottom{
    width:140px;
    position:absolute;
    opacity:.75;
}

.floral-top{
    top:0;
    left:0;
}

.floral-bottom{
    bottom:0;
    right:0;
    transform:rotate(180deg);
}

.subtitle{
    font-size:20px;
    letter-spacing:4px;
    margin-top:70px;
}

.title{
    font-family:'Great Vibes', cursive;
    font-size:64px;
    margin:25px 0;
}

.date{
    font-size:24px;
    letter-spacing:3px;
    margin-bottom:45px;
}

.envelope{
    width:260px;
    margin:auto;
    cursor:pointer;
    transition:.5s;
}

.envelope:hover{
    transform:scale(1.03);
}

.envelope img{
    width:100%;
    border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.click-text{
    margin-top:20px;
    font-size:18px;
    letter-spacing:2px;
}

.reserve{
    margin-top:45px;
    font-size:18px;
    letter-spacing:2px;
}

.number-box{
    display:inline-block;
    margin:18px 0;
    padding:12px 30px;
    border:2px solid #9cb2a7;
    border-radius:18px;
    font-size:52px;
}

.confirm-btn{
    margin-top:35px;
    background:none;
    border:1px solid #8fa59b;
    padding:14px 38px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.confirm-btn:hover{
    background:#8fa59b;
    color:white;
}
</style>
</head>
<body>

<div class="container">

<img class="floral-top" src="floral-top.png">

<div class="subtitle">NUESTRA BODA</div>

<div class="title">Felipe & Nataly</div>

<div class="date">29 · AGOSTO · 2025</div>

<div class="envelope">
<img src="sobre.png">
</div>

<div class="click-text">CLICK PARA ABRIR LA INVITACIÓN</div>

<div class="reserve">HEMOS RESERVADO</div>

<div class="number-box">2</div>

<div class="reserve">LUGARES EN SU HONOR</div>

<button class="confirm-btn">Confirmar asistencia</button>

<img class="floral-bottom" src="floral-bottom.png">

</div>

</body>
</html>
