<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Especial</title>

<meta property="og:title" content="Invitación Especial">
<meta property="og:description" content="Haz clic para abrir tu invitación">
<meta property="og:image" content="preview.jpg">

<style>
body {
    margin: 0;
    background: #f5f1eb;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.envelope {
    width: 220px;
    height: 140px;
    position: relative;
    cursor: pointer;
    perspective: 1000px;
}

.base {
    width: 100%;
    height: 100%;
    background: #d8b48a;
    position: absolute;
    border-radius: 4px;
}

.flap {
    width: 100%;
    height: 70px;
    background: #c89b6d;
    position: absolute;
    top: 0;
    transform-origin: top;
    transition: transform 1s ease;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.message {
    position: absolute;
    width: 90%;
    height: 90%;
    background: white;
    top: 5%;
    left: 5%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    transition: transform 1s ease;
}

.envelope.open .message {
    transform: translateY(-160px);
}

#video-container {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 999;
}

#video-container iframe {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div class="container">
    <div class="envelope" id="envelope">
        <div class="base"></div>
        <div class="flap"></div>
        <div class="message">Abrir invitación</div>
    </div>
</div>

<div id="video-container">
    <iframe id="vimeoVideo"
        src=""
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

<script>
const envelope = document.getElementById('envelope');
const videoContainer = document.getElementById('video-container');
const iframe = document.getElementById('vimeoVideo');

envelope.addEventListener('click', () => {
    envelope.classList.add('open');

    setTimeout(() => {
        document.querySelector('.container').style.display = 'none';
        videoContainer.style.display = 'block';

        iframe.src = "https://player.vimeo.com/video/TU_VIDEO_ID?autoplay=1";
    }, 1500);
});
</script>

</body>
</html>
